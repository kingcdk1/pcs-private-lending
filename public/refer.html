<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Refer an Investor — PCS Lending</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--black:#000;--navy:#0D1F3C;--blue:#1B3D7A;--blue-light:#4A80D4;--card:#0A1628;--input:#0D1B30;--border:#1A2744;--off:#E8EDF5;--gray:#8896AB}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'DM Sans',sans-serif;background:var(--black);color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .box{width:100%;max-width:440px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:34px 30px;text-align:center}
  .box::before{content:'';display:block;height:3px;width:60px;margin:0 auto 22px;border-radius:3px;background:linear-gradient(90deg,var(--blue),var(--blue-light))}
  h1{font-family:'Playfair Display',serif;font-size:24px;margin-bottom:6px}
  .sub{color:var(--gray);font-size:14px;margin-bottom:22px}
  label{display:block;text-align:left;font-size:12.5px;font-weight:600;color:var(--off);margin:14px 0 6px}
  input{width:100%;padding:13px 15px;border:1.5px solid var(--border);border-radius:10px;background:var(--input);color:#fff;font-family:inherit;font-size:15px;outline:none}
  input:focus{border-color:var(--blue-light)}
  .linkbox{display:flex;gap:8px;margin-top:6px}
  .linkbox input{font-size:13px;color:var(--blue-light)}
  button{font-family:inherit;font-weight:600;border:none;border-radius:10px;cursor:pointer;transition:.2s}
  .copy{background:var(--blue);color:#fff;padding:0 16px}
  .dl{background:linear-gradient(135deg,#2E5BA8,var(--blue));color:#fff;width:100%;padding:13px;margin-top:16px;font-size:15px}
  #qr{margin:20px auto 4px;display:inline-block;background:#fff;padding:12px;border-radius:12px}
  .how{font-size:12.5px;color:var(--gray);margin-top:18px;line-height:1.6}
  a.back{display:inline-block;margin-top:18px;color:var(--blue-light);font-size:13px;font-weight:600}
</style>
</head>
<body>
<div class="box">
  <h1>Refer an Investor</h1>
  <p class="sub">Enter your name to get a personal link + QR. Anyone who uses it and gets funded is tagged to you.</p>
  <label>Site Link <span style="font-weight:400;color:var(--gray)">(editable)</span></label>
  <input type="text" id="base" value="https://lending.pcstaxservice.com/">
  <label>Your Name</label>
  <input type="text" id="name" placeholder="e.g. Jordan Reyes" oninput="build()">
  <label>Your Referral Link</label>
  <div class="linkbox"><input type="text" id="link" readonly><button class="copy" onclick="copyLink()">Copy</button></div>
  <div id="qr"></div>
  <button class="dl" onclick="dl()">Download QR</button>
  <p class="how"><b>How it works:</b> text the link or print the QR. When they pre-qualify, your name auto-fills "Referred By" — you get the credit. No app, no sign-up.</p>
  <a class="back" href="/">&larr; Back to site</a>
</div>
<script>
  var qr=null;
  function build(){
    var base=document.getElementById('base').value.trim()||'https://lending.pcstaxservice.com/';
    var name=document.getElementById('name').value.trim();
    var link=name?base+(base.indexOf('?')>-1?'&':'?')+'ref='+encodeURIComponent(name):base;
    document.getElementById('link').value=link;
    document.getElementById('qr').innerHTML='';
    qr=new QRCode(document.getElementById('qr'),{text:link,width:180,height:180,colorDark:'#0D1F3C',colorLight:'#ffffff'});
  }
  function copyLink(){var i=document.getElementById('link');i.select();document.execCommand('copy');event.target.textContent='Copied';setTimeout(function(){event.target.textContent='Copy'},1200);}
  function dl(){var img=document.querySelector('#qr img')||document.querySelector('#qr canvas');if(!img)return;var a=document.createElement('a');a.href=img.src||img.toDataURL('image/png');a.download='pcs-lending-referral-qr.png';a.click();}
  build();
</script>
</body>
</html>
